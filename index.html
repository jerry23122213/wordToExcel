<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信访登记表 → Excel 导入模板 转换工具</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<!-- 内嵌 xlsx 模板（含完整框线/列宽/合并单元格/数据验证）；带版本号避免浏览器缓存旧文件 -->
<script src="template-data.js?v=20261023"></script>
</head>
<body>
<header class="app-header">
  <h1>Word 信访登记表 → Excel 导入模板转换工具</h1>
  <p class="subtitle">批量上传 .docx 登记表，自动解析字段，校对后导出为省一体化平台导入模板</p>
</header>

<!-- 顶部固定工具栏 -->
<div class="toolbar" id="toolbar">
  <div class="toolbar-left">
    <label class="btn btn-primary">
      上传 Word 文件
      <input type="file" id="fileInput" accept=".docx,.doc" multiple hidden>
    </label>
    <button class="btn" id="selectAllBtn">全选 / 取消全选</button>
    <button class="btn btn-danger" id="deleteSelBtn">删除选中</button>
    <button class="btn btn-success" id="exportBtn">导出 Excel</button>
  </div>
  <div class="toolbar-right">
    <span class="stat" id="statText">共 0 条 · 已选 0 条</span>
  </div>
</div>

<!-- 拖拽区 -->
<div class="dropzone" id="dropzone">
  <p>点击「上传 Word 文件」按钮，或将一个 / 多个 <strong>.docx / .doc</strong> 文件拖拽到此处</p>
</div>

<!-- 错误 / 提示区 -->
<div class="message-area" id="messageArea" hidden></div>

<!-- 主表格 -->
<main class="table-wrap">
  <table class="data-table" id="dataTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-tip" id="emptyTip">暂无数据，请先上传 Word 信访登记表（.docx）</div>
</main>

<!-- 编辑模态框 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>编辑记录 <span id="modalIndex" class="modal-index"></span></h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script src="parser.js"></script>
<script src="exporter.js"></script>
<script src="app.js"></script>
</body>
</html>
